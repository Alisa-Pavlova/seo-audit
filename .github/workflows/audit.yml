name: 📊 SEO Audit

on:
  schedule:
    # Запускается каждый день в 10:00 UTC (12:00 московского времени)
    - cron: "0 10 * * *"
  workflow_dispatch: # Можно запустить вручную из GitHub

jobs:
  audit:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Разрешение на коммит результатов
      pages: write # Публикация отчета на GitHub Pages
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🚀 Run SEO audit
        run: npm run audit
        timeout-minutes: 30

      - name: 💾 Commit and push reports
        run: |
          git config --local user.email "github-actions[bot]@users.githubusercontent.com"
          git config --local user.name "github-actions[bot]"
          git add seo_reports/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "📊 Update SEO audit reports - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          )

      - name: 🎨 Render report
        run: npm run render

      - name: 🌍 Setup Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 💬 Send report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run notify

      - name: 📧 Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-reports
          path: seo_reports/
          retention-days: 30
